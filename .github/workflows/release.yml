name: Build and publish Windows release

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Setup and Portable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply version from tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -match '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            npm version $version --no-git-tag-version --allow-same-version
          } else {
            Write-Host "Tag is not a semantic version; keeping package.json version."
          }

      - name: Build Windows packages
        run: npm run build:win

      - name: Select release identity
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "name=FlowDock ${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            "tag=build-$shortSha" >> $env:GITHUB_OUTPUT
            "name=FlowDock build $shortSha" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*-Setup.exe
            release/*-Portable.exe
